# # Rename this file to companies.yaml and fill in your 100+ companies.
# #
# # `type` is optional. If you omit it, the scraper auto-detects from the URL
# # (works for Greenhouse / Lever / SmartRecruiters / Ashby boards). For a
# # custom career page on the company's own domain, set type: generic.
# #
# # type options: greenhouse | lever | smartrecruiters | ashby | generic
# #
# # How to find the right URL for each type:
# #   greenhouse       -> boards.greenhouse.io/<company>
# #   lever            -> jobs.lever.co/<company>
# #   smartrecruiters  -> jobs.smartrecruiters.com/<company>
# #   ashby            -> jobs.ashbyhq.com/<company>
# #   generic          -> the company's own /careers page

